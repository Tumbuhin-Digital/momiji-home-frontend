name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2221
          command_timeout: 30m
          script: |
            set -eo pipefail
            # nvm/pm2 tidak otomatis ter-load di sesi SSH non-interaktif
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi

            cd /var/www/momiji/frontend
            git pull --ff-only
            npm ci
            npm run build
            pm2 reload momiji-frontend --update-env || pm2 start npm --name momiji-frontend -- start
            pm2 save
